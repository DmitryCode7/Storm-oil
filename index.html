<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>STORM OIL - ONLINE</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Inter,Arial,sans-serif}
body{background:#0f0f0f;color:#fff;font-size:13px}
.header{display:flex;justify-content:space-between;align-items:center;padding:12px 20px;background:#181818;border-bottom:1px solid #333;position:sticky;top:0;z-index:10}
.logo{font-weight:900;font-size:22px;background:linear-gradient(90deg,#fff,#c79a5d);-webkit-background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:1.5px}
.page{padding:16px;max-width:1100px;margin:0 auto}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;margin-top:14px}
.card{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;background:#1c1c1c;border:1px solid #333;padding:12px 10px;border-radius:12px;cursor:pointer;transition:.25s;position:relative;min-height:105px}
.card:hover{border-color:#c79a5d;transform:translateY(-2px);background:#222}
.icon{font-size:54px;margin-bottom:8px}
.cat-name{font-weight:700;font-size:13px}
.brand-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;gap:8px;flex-wrap:wrap}
.back-small{background:#222;border:1px solid #333;color:#c79a5d;padding:7px 14px;border-radius:8px;font-size:12px;cursor:pointer;font-weight:600}
.brand-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:5px;margin-top:8px}
.brand-card{background:#1c1c1c;border:1px solid #333;padding:9px 6px;border-radius:10px;text-align:center;font-weight:700;font-size:13px;cursor:pointer;position:relative;min-height:40px;display:flex;align-items:center;justify-content:center}
.brand-card:hover{border-color:#c79a5d;background:#222}
table{width:100%;border-collapse:collapse;margin-top:12px;background:#1a1a1a;border-radius:10px;overflow:hidden}
th{text-align:left;padding:8px 6px;background:#222;color:#c79a5d;font-size:11px;text-transform:uppercase}
td{padding:7px 6px;border-top:1px solid #2a2a2a;font-size:13px}
.btn{padding:7px 12px;background:#c79a5d;color:#000;border:none;border-radius:6px;font-weight:700;cursor:pointer;font-size:12px}
.admin-bar{display:flex;gap:6px;margin:10px 0;flex-wrap:wrap}
input{background:#222;border:1px solid #444;color:#fff;padding:6px 8px;border-radius:5px;font-size:12px}
.del{position:absolute;top:3px;right:4px;background:#2a2a2a;border:none;color:#ff4444;width:16px;height:16px;border-radius:50%;cursor:pointer;font-weight:900}
.online{font-size:10px;color:#00ff88;margin-left:8px}
</style>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
</head>
<body>
<div class="header"><div class="logo">STORM OIL <span class="online">● ONLINE</span></div><button onclick="toggleAdmin()" id="adminBtn" style="background:none;border:1px solid #444;color:#aaa;padding:6px 10px;border-radius:6px;cursor:pointer;font-size:11px">Войти как админ</button></div>
<div class="page" id="app">Загрузка базы...</div>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyCaOuFbbEACUF2jRdlIxJQUNUGfD4gUSeE",
  authDomain: "storm-oil.firebaseapp.com",
  projectId: "storm-oil",
  storageBucket: "storm-oil.firebasestorage.app",
  messagingSenderId: "81277457617",
  appId: "1:81277457617:web:00f20b7e3f9e33d13461f0",
  measurementId: "G-VSXVT324Q1"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
let isAdmin = localStorage.getItem('storm_admin')==='1';
let currentCat=null, currentBrand=null;
let store = null;
async function load(){
 const ref = db.collection('storm').doc('data');
 const snap = await ref.get();
 if(snap.exists){
   store = snap.data();
 } else {
   store = {
     categories:[{id:1,name:'Моторное масло',icon:'🛢️'},{id:2,name:'Дизельное масло',icon:'🚛'},{id:3,name:'Трансмиссионное масло',icon:'⚙️'},{id:4,name:'Гидравлическое масло',icon:'💧'},{id:5,name:'Компрессорное масло',icon:'🌀'},{id:6,name:'Автохимия',icon:'🧪'},{id:7,name:'Смазки',icon:'🧴'},{id:8,name:'Мото масло',icon:'🏍️'},{id:9,name:'Антифриз',icon:'❄️'}],
     brands:{1:[],2:[],3:[],4:[],5:[],6:[],7:[],8:[],9:[]},
     products:{}
   };
   await ref.set(store);
 }
 renderCategories();
 ref.onSnapshot(s=>{
   if(s.exists){ store=s.data();
     if(!currentCat &&!currentBrand) renderCategories();
   }
 });
}
async function save(){ await db.collection('storm').doc('data').set(store); }
function renderCategories(){currentCat=null;currentBrand=null;if(!store) return;document.getElementById('app').innerHTML=`<h1>Категории • ${store.categories.length}</h1><p style="color:#888;margin-top:4px">Данные из облака Firebase — видят все</p>${isAdmin?`<div class="admin-bar"><input id="newCat" placeholder="Новая категория"><button class="btn" onclick="addCategory()">+ Добавить</button></div>`:''}<div class="grid">${store.categories.map(c=>`<div class="card" onclick="openCategory(${c.id})"><div class="icon">${c.icon||'📦'}</div><div class="cat-name">${c.name}</div>${isAdmin?`<button class="del" style="top:6px;right:7px;width:22px;height:22px" onclick="event.stopPropagation();delCategory(${c.id})">✕</button>`:''}</div>`).join('')}</div>`;}
async function addCategory(){const el=document.getElementById('newCat');const name=el.value.trim();if(!name) return;const id=Date.now();store.categories.push({id,name,icon:'📦'});store.brands[id]=[];await save();renderCategories();}
async function delCategory(id){if(!confirm('Удалить категорию?')) return;store.categories=store.categories.filter(c=>c.id!==id);delete store.brands[id];await save();renderCategories();}
function openCategory(id){currentCat=store.categories.find(c=>c.id===id);const brands=[...(store.brands[id]||[])].sort((a,b)=>a.toLowerCase().localeCompare(b.toLowerCase()));document.getElementById('app').innerHTML=`<div class="brand-header"><h1>${currentCat.icon||''} ${currentCat.name}</h1><div class="back-small" onclick="renderCategories()">← к категориям</div></div><p style="color:#888;margin-bottom:8px">Брендов: ${brands.length} • из Firebase</p>${isAdmin?`<div class="admin-bar"><input id="newBrand" placeholder="Новый бренд"><button class="btn" onclick="addBrand()">+ Бренд</button></div>`:''}<div class="brand-grid">${brands.map(b=>`<div class="brand-card" onclick="openBrand('${b}')">${b}${isAdmin?`<button class="del" onclick="event.stopPropagation();delBrand('${b}')">✕</button>`:''}</div>`).join('')}</div>`;}
async function addBrand(){const el=document.getElementById('newBrand');const name=el.value.trim();if(!name) return;if(!store.brands[currentCat.id]) store.brands[currentCat.id]=[];if(store.brands[currentCat.id].includes(name)) return alert('Уже есть');store.brands[currentCat.id].push(name);await save();openCategory(currentCat.id);}
async function delBrand(b){if(!confirm(`Удалить ${b}?`)) return;store.brands[currentCat.id]=store.brands[currentCat.id].filter(x=>x!==b);await save();openCategory(currentCat.id);}

// --- ИСПРАВЛЕНО: КЛЮЧ = ID КАТЕГОРИИ + ИМЯ БРЕНДА ---
function openBrand(brand){
  currentBrand=brand;
  const key=currentCat.id+'_'+brand;
  if(!store.products[key]){
    store.products[key]=[];
    save();
  }
  const list=[...(store.products[key]||[])].sort((a,b)=>a.name.toLowerCase().localeCompare(b.name.toLowerCase()));
  document.getElementById('app').innerHTML=`<div class="brand-header"><h1>${brand} <span style="color:#888;font-size:12px">[${currentCat.name}]</span></h1><div class="back-small" onclick="openCategory(${currentCat.id})">← к брендам</div></div><input id="sProd" oninput="filterProd()" placeholder="Поиск..." style="width:100%;margin-top:8px;padding:8px" class="search">${isAdmin?`<div class="admin-bar"><input id="pName" placeholder="Название"><input id="pVol" placeholder="Объем" style="width:70px"><input id="pPrice" placeholder="Цена" style="width:80px"><button class="btn" onclick="addProd()">+ Товар</button></div>`:''}<table><thead><tr><th>№</th><th>Название</th><th>Объем</th><th>Цена</th>${isAdmin?'<th></th>':''}</tr></thead><tbody id="tbody">${list.map((p,i)=>`<tr data-name="${p.name.toLowerCase()}"><td>${i+1}</td><td>${p.name}</td><td>${p.volume}</td><td>${isAdmin?`<input value="${p.price}" onchange="updPrice(${p.id},this.value)" style="width:70px">`:p.price+' ₸'}</td>${isAdmin?`<td><button onclick="delProd(${p.id})" style="background:none;border:none;color:#f44;cursor:pointer;font-weight:900">✕</button></td>`:''}</tr>`).join('')}</tbody></table>`;
}
function filterProd(){const q=document.getElementById('sProd').value.toLowerCase();document.querySelectorAll('#tbody tr').forEach(tr=>{tr.style.display=tr.dataset.name.includes(q)?'':'none'})}
async function addProd(){
  const n=document.getElementById('pName').value.trim();
  const v=document.getElementById('pVol').value.trim();
  const pr=document.getElementById('pPrice').value.trim();
  if(!n) return alert('Название');
  const key=currentCat.id+'_'+currentBrand;
  if(!store.products[key]) store.products[key]=[];
  store.products[key].push({id:Date.now(),name:n,volume:v||'-',price:pr||0});
  await save();openBrand(currentBrand);
}
async function delProd(id){
  if(!confirm('Удалить товар?')) return;
  const key=currentCat.id+'_'+currentBrand;
  store.products[key]=store.products[key].filter(p=>p.id!==id);
  await save();openBrand(currentBrand);
}
async function updPrice(id,val){
  const key=currentCat.id+'_'+currentBrand;
  const p=store.products[key].find(x=>x.id===id);
  if(p){p.price=val;await save();}
}
function toggleAdmin(){if(!isAdmin){let l=prompt("Логин:");let p=prompt("Пароль:");if(l==="admin" && p==="Storm123"){isAdmin=true;localStorage.setItem('storm_admin','1');} else {alert("Неверно");return;}} else {isAdmin=false;localStorage.setItem('storm_admin','0');}document.getElementById('adminBtn').innerText=isAdmin?'Выйти':'Войти как админ';if(currentBrand) openBrand(currentBrand); else if(currentCat) openCategory(currentCat.id); else renderCategories();}
window.onload=()=>{if(isAdmin) document.getElementById('adminBtn').innerText='Выйти';load();};
</script>
</body>
</html>
